version: 2.1

executors:
  java_executor:
    docker:
      - image: cimg/openjdk:17.0

jobs:
  build:
    executor: java_executor
    steps:
      - checkout
      - run:
          name: Build project
          command: mvn clean package -DskipTests
      - persist_to_workspace:
          root: .
          paths:
            - .

  test:
    executor: java_executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Run Tests
          command: mvn test
      - store_test_results:
          path: target/surefire-reports/

  checkstyle:
    executor: java_executor
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Static Code Analysis
          command: mvn checkstyle:checkstyle
      - store_artifacts:
          path: target/site/checkstyle.html
          destination: checkstyle-report/

  deploy_local:
    executor: java_executor
    environment:
      DEPLOY_PATH: /tmp/deploy
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: Deploy Local Simulation
          command: |
            rm -rf $DEPLOY_PATH
            mkdir -p $DEPLOY_PATH
            cp target/*.jar $DEPLOY_PATH/deploy_integrador_calidad.jar
      - store_artifacts:
          path: /tmp/deploy/deploy_integrador_calidad.jar
          destination: deploy/

workflows:
  build_test_deploy:
    jobs:
      - build
      - test:
          requires:
            - build
      - checkstyle:
          requires:
            - build
      - deploy_local:
          requires:
            - test
            - checkstyle