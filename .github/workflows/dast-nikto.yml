name: DAST - Nikto Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nikto_dast:
    runs-on: windows-latest

    steps:
    # 1️⃣ Clonar repo
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2️⃣ Instalar Java
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3️⃣ Instalar Perl (Nikto)
    - name: Install Strawberry Perl
      run: choco install strawberryperl -y

    # 4️⃣ Descargar Nikto
    - name: Install Nikto
      run: git clone https://github.com/sullo/nikto.git C:\nikto

    # 5️⃣ Compilar proyecto (Maven)
    - name: Build project
      run: mvn clean package -DskipTests

    # 6️⃣ Ejecutar aplicación Java (background)
    - name: Run application
      run: |
        Start-Process java `
          -ArgumentList "-jar target/*.jar" `
          -NoNewWindow
        Start-Sleep -Seconds 20

    # 7️⃣ Ejecutar DAST Nikto
    - name: Run Nikto Scan
      run: |
        perl C:\nikto\program\nikto.pl `
          -h http://localhost:8080 `
          -o nikto-report.html `
          -Format html

    # 8️⃣ Guardar reporte
    - name: Upload Nikto Report
      uses: actions/upload-artifact@v4
      with:
        name: nikto-dast-report
        path: nikto-report.html