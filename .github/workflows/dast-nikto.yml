name: DAST - Nikto Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nikto_dast:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Strawberry Perl
      run: |
        choco install strawberryperl -y

    - name: Install Nikto
      run: |
        git clone https://github.com/sullo/nikto.git C:\nikto

     # Restaurar, compilar y ejecutar la aplicación (ejemplo .NET)
    - name: Run application
      run: |
        dotnet restore
        dotnet build
        start /B dotnet run
        timeout /T 15

    #  Ejecutar DAST con Nikto
    - name: Run Nikto Scan
      run: |
        perl C:\nikto\program\nikto.pl ^
          -h http://localhost:5000 ^
          -o nikto-report.html ^
          -Format html

    # Guardar el reporte como artefacto
    - name: Upload Nikto Report
      uses: actions/upload-artifact@v4
      with:
        name: nikto-dast-report
        path: nikto-report.html