name: DAST - Nikto Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  nikto_dast:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Strawberry Perl
      run: |
        choco install strawberryperl -y

    - name: Install Nikto
      run: |
        git clone https://github.com/sullo/nikto.git C:\nikto

    # 🔧 RESTORE + BUILD (ESPECIFICANDO PROYECTO)
    - name: Restore and Build
      run: |
        dotnet restore ./ProyectoTestUnitarios/ProyectoTestUnitarios.csproj
        dotnet build ./ProyectoTestUnitarios/ProyectoTestUnitarios.csproj

    # ▶️ EJECUTAR APP (PowerShell correcto)
    - name: Run application
      run: |
        Start-Process dotnet `
          -ArgumentList "run --project ./ProyectoTestUnitarios/ProyectoTestUnitarios.csproj" `
          -NoNewWindow
        Start-Sleep -Seconds 15

    # 🔐 DAST Nikto
    - name: Run Nikto Scan
      run: |
        perl C:\nikto\program\nikto.pl `
          -h http://localhost:5000 `
          -o nikto-report.html `
          -Format html

    - name: Upload Nikto Report
      uses: actions/upload-artifact@v4
      with:
        name: nikto-dast-report
        path: nikto-report.html