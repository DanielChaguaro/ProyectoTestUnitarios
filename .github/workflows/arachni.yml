name: DAST - Arachni Scan

on:
  workflow_run:
    workflows: ["SAST - Semgrep Scan"]
    types:
      - completed

jobs:
  arachni:
    name: Arachni DAST
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build project
        run: mvn clean package

      - name: Run application
        run: |
          java -jar target/*.jar &
          sleep 60

      - name: Run Arachni DAST Scan
        run: |
          docker run --rm \
            --network host \
            arachni/arachni \
            http://localhost:8080 \
            --report-save-path=/tmp/arachni.afr

      - name: Generate Arachni Report
        run: |
          docker run --rm \
            -v $PWD:/reports \
            arachni/arachni \
            arachni_reporter /tmp/arachni.afr \
            --reporter=html:outfile=/reports/arachni-report.html

      - name: Upload Arachni report
        uses: actions/upload-artifact@v4
        with:
          name: arachni-report
          path: arachni-report.html